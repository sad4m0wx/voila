services:
  
  graphhopper:
    image: israelhikingmap/graphhopper:latest
    ports:
      - "8989:8989"
    volumes:
      - ./graphhopper-data:/data
    environment:
      - JAVA_OPTS=-Xmx8g -Xms3g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - GRAPHHOPPER_OPTS=-Dgraphhopper.graph.flagEncoders=foot,pt|turn_costs=true
    command: >
      --config /data/config.yml

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    depends_on:
      - graphhopper

volumes:
  redis-data:

      
    

