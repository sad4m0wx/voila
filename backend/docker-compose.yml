services:

  rust-api:
    build: ./core-api
    restart: always
    depends_on:
      - graphhopper
      - redis
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - GRAPHHOPPER_URL=http://graphhopper:8989
      - REDIS_URL=redis://redis:6379
      - MAPS_PLACES_API_KEY=${MAPS_PLACES_API_KEY}
    networks:
      - voila-network

  graphhopper:
    image: israelhikingmap/graphhopper:latest
    restart: always
    ports:
      - "8989:8989"  # Directly expose the API port for testing
    volumes:
      - ./graphhopper-data:/data
    environment:
      - JAVA_OPTS=-Xmx14g -Xms14g -XX:+UseG1GC -XX:MaxGCPauseMillis=100
      - GRAPHHOPPER_OPTS=-Dgraphhopper.graph.flagEncoders=foot,pt|turn_costs=true
    command: >
      --config /data/config.yml
    networks:
      - voila-network

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - voila-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"     # HTTP - will redirect to HTTPS
      - "443:443"   # HTTPS 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/voila-app.fr/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/voila-app.fr/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      - rust-api
    networks:
      - voila-network
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost/health", "--insecure"]
      interval: 30s
      timeout: 10s
      retries: 3


networks:
  voila-network:
    driver: bridge
    

volumes:
  redis-data:
