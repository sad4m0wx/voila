[package]
name = "core-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web server and routing
actix-web = "4.3.1"
actix-cors = "0.6.4"

# Serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Config management
config = "0.13"
dotenv = "0.15"

# Geo utilities
geo-types = "0.7"
geo = "0.24"

# Error handling
thiserror = "1.0"
anyhow = "1.0"
chrono = "0.4.40"
reqwest = { version = "0.11", features = ["json"] }