graphhopper:
  datareader.file: /data/osm/ile-de-france-foot-transit.osm.pbf  # https://download.geofabrik.de/europe/france/ile-de-france-latest.osm.pbf
  graph.location: /data/graphs
  gtfs.file: /data/gtfs/simplified-idfm-gtfs.zip   # https://www.data.gouv.fr/fr/datasets/r/f9fff5b1-f9e4-4ec2-b8b3-8ad7005d869c
  import.osm.ignored_highways: motorway,trunk
  profiles:
    - name: foot
      custom_model_files:
        - foot.json
    - name: pt
      custom_model: {"speed": [{ "if": "true", "limit_to": "foot_average_speed" }]}
  profiles_ch:
    - profile: foot
    - profile: pt
  graph.encoded_values: foot_access, foot_average_speed, foot_priority, foot_road_access, hike_rating, mtb_rating, country, road_class
  graph.dataaccess: MMAP_STORE
  
  prepare.min_network_size: 200
  prepare.min_one_way_network_size: 0
  
  # GTFS-specific settings
  gtfs.max_transfer_distance: 400
  gtfs.walk_speed: 5.0
  gtfs.data_import: true

  graph.do_sort: true
  graph.optimize_storage: true

  graph.import_threads: 4
  
  datareader:
      gtfs:
        base-osm-filter: true
        max-wait-time: 900  # seconds
        walk-speed: 5.0

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0