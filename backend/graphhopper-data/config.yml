graphhopper:
  datareader.file: /data/osm/ile-de-france-simplified.osm.pbf  # https://download.geofabrik.de/europe/france/ile-de-france-latest.osm.pbf
  graph.location: /data/graphs
  gtfs.file: /data/gtfs/IDFM-gtfs-filtered.zip   # https://eu.ftp.opendatasoft.com/stif/GTFS/IDFM-gtfs.zip
  import.osm.ignored_highways: motorway,trunk,primary,secondary
  profiles:
    - name: foot
      custom_model_files:
        - foot.json
    - name: pt
      custom_model: {"speed": [{ "if": "true", "limit_to": "foot_average_speed" }]}
  profiles_ch:
    - profile: foot
    - profile: pt
  graph.encoded_values: foot_access, foot_average_speed, foot_priority, foot_road_access, hike_rating, mtb_rating, country, road_class, road_environment
  graph.dataaccess: MMAP_STORE
  
  prepare.min_network_size: 200
  prepare.min_one_way_network_size: 0

  isochrone: true
  
  # Isochrone Performance Optimizations
  isochrone.simplify: true
  isochrone.geometry_simplification: 50.0   # Reduce geometry complexity
  isochrone.snap_preventions: tunnel,ferry
  
  # GTFS-specific settings optimized for frequency-based routing
  gtfs.max_transfer_distance: 800  
  gtfs.walk_speed: 5.0
  gtfs.data_import: true
  
  # Frequency-based routing settings
  gtfs.max_wait_time: 600  # Maximum wait time (10 minutes)
  gtfs.min_transfer_time: 120  # Minimum transfer time (2 minutes)
  gtfs.use_frequencies: true  # Enable frequency-based routing
  gtfs.ignore_real_time: true  # Ignore schedule variations
  
  # Optimize for frequency-based queries - REDUCED FOR CPU OPTIMIZATION
  graph.do_sort: true
  graph.optimize_storage: true
  graph.import_threads: 2              # Reduced from 4 to 2
  graph.precalculate: false            # Disabled to reduce CPU load
  graph.precalculate_distance: 200     # Reduced from 500
  
  routing.calc_points: true
  routing.debug: false
  
  index.high_resolution: 2000
  prepare.lm.landmarks: 4
  
  web.jsonp_allowed: false
  web.cors_origin: "*"

  isochrone.max_buckets: 20
  isochrone.max_time: 3600
  isochrone.max_distance: 5000
  isochrone.precision_reduction: 0.1   # Reduce coordinate precision to ~10m accuracy
  
  datareader:
    gtfs:
      base-osm-filter: true
      walk-speed: 5.0
      use-optimized-transfers: true  
      transfers-min-transfer-time: 60
      
      use-frequencies: true
      ignore-stop-times: false 
      default-headway: 600 
      
      
      max-transfer-distance: 800  
      create-walk-connections: true 
      cluster-stops: false 
      
      fare-approximation: false
      transfer-time-cutoff: 1200
      memory-mapped: true
      skip-stops-outside-border: true
      skip-shapes: false 
      skip-trips-without-shapes: false

  # GPS Precision Reduction for Performance
  routing.response.way_point_max_distance: 30000
  routing.max_visited_nodes: 1000000

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
      idle_timeout: 120s
      max_request_header_size: 32KiB
      max_response_header_size: 32KiB
  request_log:
    appenders: []
  max_threads: 32
  min_threads: 4
  shutdown_grace_period: 30s
  request_log:
    appenders: []
