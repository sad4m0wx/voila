graphhopper:
  datareader.file: /data/osm/ile-de-france-foot-transit.osm.pbf  # https://download.geofabrik.de/europe/france/ile-de-france-latest.osm.pbf
  graph.location: /data/graphs
  gtfs.file: /data/gtfs/IDFM-gtfs-filtered.zip   # https://eu.ftp.opendatasoft.com/stif/GTFS/IDFM-gtfs.zip
  import.osm.ignored_highways: motorway,trunk,primary,secondary
  profiles:
    - name: foot
      custom_model_files:
        - foot.json
    - name: pt
      custom_model: {"speed": [{ "if": "true", "limit_to": "foot_average_speed" }]}
  profiles_ch:
    - profile: foot
    - profile: pt
  graph.encoded_values: foot_access, foot_average_speed, foot_priority, foot_road_access, hike_rating, mtb_rating, country, road_class
  graph.dataaccess: MMAP_STORE
  
  prepare.min_network_size: 200
  prepare.min_one_way_network_size: 0
  
  # GTFS-specific settings
  gtfs.max_transfer_distance: 400
  gtfs.walk_speed: 5.0
  gtfs.data_import: true
  

  gtfs.create_virtual_schedule: true  # Creates synthetic schedules
  gtfs.default_headway: 300  # 5-minute default frequency
  
  graph.do_sort: true
  graph.optimize_storage: true
  graph.import_threads: 4
  
  datareader:
    gtfs:
      base-osm-filter: true
      max-wait-time: 600  # Increased since we're using approximations
      walk-speed: 5.0
      use-optimized-transfers: true
      transfers-min-transfer-time: 60
      

      cluster-stops: true
      cluster-stops-max-distance: 50  # Reduced clustering
      cluster-stops-max-transfer-time: 60
      fare-approximation: false
      memory-mapped: true
      skip-stops-outside-border: true
      
      skip-shapes: true
      generate-synthetic-schedule: true
      default-service-frequency: 300  # 5 minutes

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
  request_log:
    appenders: []
  max_threads: 32