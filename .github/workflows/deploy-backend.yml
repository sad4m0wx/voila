name: Deploy Backend

on:
  workflow_dispatch:  # manual trigger only until server is ready

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

permissions:
  contents: read
  packages: write

jobs:
  deploy-backend:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/core-api
          file: ./backend/core-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Prepare deployment files
        run: |
          # Create a production docker-compose file
          cp docker-compose.yml docker-compose.prod.yml
          
          # Replace build context with image reference
          sed -i 's|build: ./backend/core-api|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest|g' docker-compose.prod.yml

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Copy deployment files to server
        run: |
          # Copy the production docker-compose file
          scp -o StrictHostKeyChecking=no docker-compose.prod.yml ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/voila/docker-compose.yml

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -e
            cd /opt/voila
            
            echo "🔐 Logging into GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "📝 Updating environment variables..."
            {
              echo "MAPS_PLACES_API_KEY=${{ secrets.MAPS_PLACES_API_KEY }}"
              echo "GOOGLE_MAPS_GEOCODE_API_KEY=${{ secrets.GOOGLE_MAPS_GEOCODE_API_KEY }}"
            } > .env
            
            echo "🛑 Stopping existing backend service..."
            docker compose down rust-api || true

            echo "🚀 Pulling latest backend image..."
            docker compose pull rust-api
            
            echo "🔄 Starting backend service..."
            docker compose up -d rust-api
            
            echo "⏳ Waiting for backend to start..."
            for i in {1..18}; do
              sleep 10
              echo "🔍 Health check attempt $i/6..."
              if curl -f http://localhost:3001/health --max-time 10; then
                echo "✅ Backend is healthy!"
                break
              elif [ "$i" -eq 18 ]; then
                echo "❌ Backend health check failed after 180 seconds"
                echo "📋 Container status:"
                docker compose ps
                echo "📜 Recent logs:"
                docker compose logs rust-api --tail=30
                exit 1
              else
                echo "⏳ Backend not ready yet, waiting..."
              fi
            done
            
            
            
            echo "🧹 Cleaning up old images..."
            docker image prune -af --filter "until=24h"
            
            echo "✅ Backend deployment completed!"
          EOF

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Backend deployment successful!"
          else
            echo "❌ Backend deployment failed!"
          fi 