name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: |
          # Remove package-lock.json to avoid npm bug with optional dependencies
          rm -f package-lock.json
          npm install --legacy-peer-deps
          # Force rebuild of rollup to ensure native binaries are properly installed
          npm rebuild rollup

      - name: Build frontend
        working-directory: apps/web
        env:
          VITE_CORE_API_URL: ""  # Use relative URLs for API calls
          VITE_MAPS_PLACES_API_KEY: ${{ secrets.VITE_MAPS_PLACES_API_KEY }}
          VITE_MAPS_BROWSER_KEY: ${{ secrets.VITE_MAPS_BROWSER_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy to server
        run: |
          echo "🚀 Deploying frontend to server..."
          
          # Deploy built files to server
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            apps/web/build/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/voila/
          
          echo "✅ Frontend files deployed successfully!"

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            echo "🔍 Verifying frontend deployment..."
            
            if [ -f "/var/www/voila/index.html" ]; then
              echo "✅ Frontend files are in place"
              ls -la /var/www/voila/ | head -10
            else
              echo "❌ Frontend deployment failed - index.html not found"
              exit 1
            fi
          EOF

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Frontend deployment successful!"
            echo "🌐 Check your site at: https://voila-app.fr"
          else
            echo "❌ Frontend deployment failed!"
          fi 