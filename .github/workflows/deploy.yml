name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: build and push core-api docker image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Add Rust toolchain for potential local caching
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # Cache Cargo registry and git dependencies
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/core-api/Cargo.toml', 'backend/core-api/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Cache target directory
      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: backend/core-api/target/
          key: ${{ runner.os }}-target-${{ hashFiles('backend/core-api/Cargo.toml', 'backend/core-api/Cargo.lock') }}-${{ hashFiles('backend/core-api/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-target-${{ hashFiles('backend/core-api/Cargo.toml') }}-
            ${{ runner.os }}-target-

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/core-api
          file: ./backend/core-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Enhanced caching strategy
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max
          # Mount cache directories into Docker build
          cache-mounts: |
            type=cache,target=/usr/local/cargo/registry
            type=cache,target=/usr/local/cargo/git
            type=cache,target=/app/target

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Copy necessary files to server
        run: |
          scp -o StrictHostKeyChecking=no -r backend/docker-compose.yml backend/graphhopper-data/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/voila/

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd /opt/voila
            
            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Update docker-compose.yml to use the new image
            sed -i 's|build: ./core-api|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest|g' docker-compose.yml
            
            # Export the API key as an environment variable
            export MAPS_PLACES_API_KEY="${{ secrets.MAPS_PLACES_API_KEY }}"
            
            # Pull latest images and restart all services
            docker compose pull rust-api
            docker compose up -d
            
            # Clean up old images
            docker image prune -af
            
            # Show running services
            docker compose ps
          EOF