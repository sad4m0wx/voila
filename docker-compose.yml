services:

  rust-api:
    build: ./backend/core-api
    restart: always
    depends_on:
      - graphhopper
      - redis
    ports:
      - "3000:3000"  # Expose directly for nginx proxy
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - GRAPHHOPPER_URL=http://graphhopper:8989
      - REDIS_URL=redis://redis:6379
      - MAPS_PLACES_API_KEY=${MAPS_PLACES_API_KEY}
    networks:
      - voila-network

  graphhopper:
    image: israelhikingmap/graphhopper:latest
    restart: always
    ports:
      - "8989:8989"
    volumes:
      - ./backend/graphhopper-data:/data
    environment:
      - JAVA_OPTS=-Xmx10g -Xms10g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XX:G1HeapRegionSize=32m -XX:G1MixedGCCountTarget=8 -XX:InitiatingHeapOccupancyPercent=45 -XX:G1MixedGCLiveThresholdPercent=85 -XX:G1HeapWastePercent=5 -XX:+OptimizeStringConcat -XX:+UseCompressedOops -XX:+UseCompressedClassPointers -XX:ReservedCodeCacheSize=256m -XX:InitialCodeCacheSize=64m -XX:CompileThreshold=1500 -XX:ConcGCThreads=2 -XX:ParallelGCThreads=4 -XX:+DisableExplicitGC     
      - GRAPHHOPPER_OPTS=-Dgraphhopper.graph.flagEncoders=foot,pt|turn_costs=true -Djetty.threadPool.maxThreads=128 -Djetty.threadPool.minThreads=16
    command: >
      --config /data/config.yml
    networks:
      - voila-network

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - voila-network

networks:
  voila-network:
    driver: bridge
    
volumes:
  redis-data:
